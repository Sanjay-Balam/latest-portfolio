  <text x="340" y="592" font-size="10" fill="#666" text-anchor="middle" font-family="sans-serif">Mon</text>
  <text x="395" y="592" font-size="10" fill="#666" text-anchor="middle" font-family="sans-serif">Tue</text>
  <text x="450" y="592" font-size="10" fill="#666" text-anchor="middle" font-family="sans-serif">Wed</text>
  <text x="505" y="592" font-size="10" fill="#666" text-anchor="middle" font-family="sans-serif">Thu</text>
  <text x="560" y="592" font-size="10" fill="#666" text-anchor="middle" font-family="sans-serif">Fri</text>
  <text x="615" y="592" font-size="10" fill="#666" text-anchor="middle" font-family="sans-serif">Sat</text>
  <text x="670" y="592" font-size="10" fill="#6c63ff" text-anchor="middle" font-family="sans-serif" font-weight="bold">Today</text>
  <text x="725" y="592" font-size="10" fill="#666" text-anchor="middle" font-family="sans-serif">--</text>

  <!-- Recent Patients Table -->
