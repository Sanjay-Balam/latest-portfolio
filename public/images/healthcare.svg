  <text x="305" y="285" font-size="28" fill="#fff" font-family="sans-serif" font-weight="bold">5,247</text>
  <text x="305" y="308" font-size="11" fill="#10b981" font-family="sans-serif">+12.5% this month</text>
  <rect x="430" y="240" width="30" height="30" rx="6" fill="#10b981" opacity="0.15"/>
  <text x="445" y="260" font-size="16" fill="#10b981" text-anchor="middle" font-family="sans-serif">+</text>

