<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#121228"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e3a"/>
      <stop offset="100%" style="stop-color:#181830"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg3)"/>

  <!-- App Container -->
  <rect x="60" y="40" width="1080" height="720" rx="12" fill="#14142a" stroke="#2a2a4a" stroke-width="1"/>

  <!-- Top Navigation Bar -->
  <rect x="60" y="40" width="1080" height="55" rx="12" fill="#1a1a35"/>
  <rect x="60" y="83" width="1080" height="12" fill="#1a1a35"/>

  <!-- Logo area -->
  <rect x="85" y="52" width="32" height="32" rx="6" fill="#10b981"/>
  <text x="101" y="74" font-size="18" fill="#fff" text-anchor="middle" font-family="sans-serif" font-weight="bold">+</text>
  <text x="130" y="74" font-size="15" fill="#fff" font-family="sans-serif" font-weight="bold">HealthHub</text>

  <!-- Nav items -->
  <text x="550" y="74" font-size="13" fill="#10b981" font-family="sans-serif" font-weight="600">Dashboard</text>
  <text x="650" y="74" font-size="13" fill="#888" font-family="sans-serif">Patients</text>
  <text x="740" y="74" font-size="13" fill="#888" font-family="sans-serif">Appointments</text>
  <text x="860" y="74" font-size="13" fill="#888" font-family="sans-serif">Reports</text>

  <!-- User avatar -->
  <circle cx="1090" cy="68" r="16" fill="#6c63ff"/>
  <text x="1090" y="73" font-size="11" fill="#fff" text-anchor="middle" font-family="sans-serif" font-weight="bold">SB</text>

  <!-- Sidebar -->
  <rect x="60" y="95" width="200" height="665" fill="#111125"/>

  <!-- Sidebar menu items -->
  <rect x="72" y="115" width="176" height="38" rx="8" fill="#10b981" opacity="0.15"/>
  <rect x="72" y="115" width="3" height="38" rx="2" fill="#10b981"/>
  <text x="95" y="139" font-size="13" fill="#10b981" font-family="sans-serif" font-weight="600">Overview</text>

  <text x="95" y="178" font-size="13" fill="#777" font-family="sans-serif">Patient Records</text>
  <text x="95" y="210" font-size="13" fill="#777" font-family="sans-serif">Appointments</text>
  <text x="95" y="242" font-size="13" fill="#777" font-family="sans-serif">Lab Results</text>
  <text x="95" y="274" font-size="13" fill="#777" font-family="sans-serif">Prescriptions</text>
  <text x="95" y="306" font-size="13" fill="#777" font-family="sans-serif">Billing</text>

  <text x="82" y="360" font-size="10" fill="#555" font-family="sans-serif" font-weight="bold" letter-spacing="1">SETTINGS</text>
  <text x="95" y="385" font-size="13" fill="#777" font-family="sans-serif">User Management</text>
  <text x="95" y="417" font-size="13" fill="#777" font-family="sans-serif">Clinic Settings</text>
  <text x="95" y="449" font-size="13" fill="#777" font-family="sans-serif">HIPAA Compliance</text>

  <!-- Main Content Area -->
