  <rect x="320" y="505" width="40" height="70" rx="4" fill="#10b981" opacity="0.7"/>
  <rect x="375" y="465" width="40" height="110" rx="4" fill="#10b981" opacity="0.7"/>
  <rect x="430" y="485" width="40" height="90" rx="4" fill="#10b981" opacity="0.7"/>
  <rect x="485" y="435" width="40" height="140" rx="4" fill="#10b981" opacity="0.9"/>
  <rect x="540" y="455" width="40" height="120" rx="4" fill="#10b981" opacity="0.7"/>
  <rect x="595" y="475" width="40" height="100" rx="4" fill="#10b981" opacity="0.7"/>
  <rect x="650" y="415" width="40" height="160" rx="4" fill="#6c63ff" opacity="0.9"/>
  <rect x="705" y="495" width="40" height="80" rx="4" fill="#10b981" opacity="0.4"/>

