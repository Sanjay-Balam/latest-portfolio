  <rect x="910" y="220" width="195" height="105" rx="10" fill="url(#card)" stroke="#2a2a4a" stroke-width="1"/>
  <text x="935" y="250" font-size="12" fill="#888" font-family="sans-serif">Active Clinics</text>
