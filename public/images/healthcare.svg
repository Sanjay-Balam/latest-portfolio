  <!-- Patient rows -->
  <circle cx="845" cy="410" r="14" fill="#e94560" opacity="0.2"/>
  <text x="845" y="414" font-size="10" fill="#e94560" text-anchor="middle" font-family="sans-serif" font-weight="bold">JD</text>
  <text x="870" y="406" font-size="12" fill="#ccc" font-family="sans-serif">John Doe</text>
  <text x="870" y="420" font-size="10" fill="#666" font-family="sans-serif">Cardiology</text>
  <rect x="1020" y="400" width="65" height="22" rx="11" fill="#10b981" opacity="0.15"/>
  <text x="1052" y="415" font-size="10" fill="#10b981" text-anchor="middle" font-family="sans-serif">Active</text>

  <circle cx="845" cy="455" r="14" fill="#6c63ff" opacity="0.2"/>
  <text x="845" y="459" font-size="10" fill="#6c63ff" text-anchor="middle" font-family="sans-serif" font-weight="bold">AS</text>
  <text x="870" y="451" font-size="12" fill="#ccc" font-family="sans-serif">Amy Smith</text>
  <text x="870" y="465" font-size="10" fill="#666" font-family="sans-serif">Dermatology</text>
  <rect x="1020" y="445" width="65" height="22" rx="11" fill="#f59e0b" opacity="0.15"/>
  <text x="1052" y="460" font-size="10" fill="#f59e0b" text-anchor="middle" font-family="sans-serif">Pending</text>

  <circle cx="845" cy="500" r="14" fill="#4ade80" opacity="0.2"/>
  <text x="845" y="504" font-size="10" fill="#4ade80" text-anchor="middle" font-family="sans-serif" font-weight="bold">RK</text>
  <text x="870" y="496" font-size="12" fill="#ccc" font-family="sans-serif">Raj Kumar</text>
  <text x="870" y="510" font-size="10" fill="#666" font-family="sans-serif">Orthopedics</text>
  <rect x="1020" y="490" width="65" height="22" rx="11" fill="#10b981" opacity="0.15"/>
  <text x="1052" y="505" font-size="10" fill="#10b981" text-anchor="middle" font-family="sans-serif">Active</text>

  <circle cx="845" cy="545" r="14" fill="#f59e0b" opacity="0.2"/>
  <text x="845" y="549" font-size="10" fill="#f59e0b" text-anchor="middle" font-family="sans-serif" font-weight="bold">LP</text>
  <text x="870" y="541" font-size="12" fill="#ccc" font-family="sans-serif">Lisa Park</text>
  <text x="870" y="555" font-size="10" fill="#666" font-family="sans-serif">Neurology</text>
  <rect x="1020" y="535" width="65" height="22" rx="11" fill="#6c63ff" opacity="0.15"/>
  <text x="1052" y="550" font-size="10" fill="#6c63ff" text-anchor="middle" font-family="sans-serif">Review</text>

  <!-- AWS / Security badges -->
  <rect x="280" y="625" width="150" height="32" rx="6" fill="#1a1a35" stroke="#f59e0b" stroke-width="1"/>
  <text x="355" y="646" font-size="11" fill="#f59e0b" text-anchor="middle" font-family="sans-serif" font-weight="600">HIPAA Compliant</text>

  <rect x="445" y="625" width="120" height="32" rx="6" fill="#1a1a35" stroke="#ff9900" stroke-width="1"/>
  <text x="505" y="646" font-size="11" fill="#ff9900" text-anchor="middle" font-family="sans-serif" font-weight="600">AWS Powered</text>

  <rect x="580" y="625" width="130" height="32" rx="6" fill="#1a1a35" stroke="#10b981" stroke-width="1"/>
  <text x="645" y="646" font-size="11" fill="#10b981" text-anchor="middle" font-family="sans-serif" font-weight="600">RBAC Enabled</text>

  <rect x="725" y="625" width="140" height="32" rx="6" fill="#1a1a35" stroke="#6c63ff" stroke-width="1"/>
  <text x="795" y="646" font-size="11" fill="#6c63ff" text-anchor="middle" font-family="sans-serif" font-weight="600">Multi-Tenant</text>

  <!-- Title -->
  <text x="600" y="770" font-size="14" fill="#888" text-anchor="middle" font-family="monospace">Next.js  |  Node.js  |  AWS  |  MongoDB  |  Cognito</text>
</svg>