  <text x="515" y="285" font-size="28" fill="#fff" font-family="sans-serif" font-weight="bold">12</text>
  <text x="515" y="308" font-size="11" fill="#f59e0b" font-family="sans-serif">3 remaining</text>

  <!-- Card 3 - Revenue -->
  <rect x="700" y="220" width="195" height="105" rx="10" fill="url(#card)" stroke="#2a2a4a" stroke-width="1"/>
  <text x="725" y="250" font-size="12" fill="#888" font-family="sans-serif">Monthly Revenue</text>
  <text x="725" y="285" font-size="28" fill="#fff" font-family="sans-serif" font-weight="bold">$84.2K</text>
  <text x="725" y="308" font-size="11" fill="#10b981" font-family="sans-serif">+8.3% vs last month</text>

