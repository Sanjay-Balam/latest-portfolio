  <text x="1040" y="150" font-size="12" fill="#10b981" text-anchor="middle" font-family="sans-serif">Today</text>
  <text x="1040" y="170" font-size="16" fill="#10b981" text-anchor="middle" font-family="sans-serif" font-weight="bold">Mar 10, 2026</text>

