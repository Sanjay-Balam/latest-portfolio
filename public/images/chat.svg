  <text x="410" y="105" font-size="11" fill="#666" font-family="sans-serif">5 members online</text>

  <!-- Chat messages -->
  <!-- Message 1 -->
  <circle cx="410" cy="160" r="16" fill="#e94560"/>
  <text x="410" y="165" font-size="12" fill="#fff" text-anchor="middle" font-family="sans-serif" font-weight="bold">A</text>
  <text x="436" y="155" font-size="14" fill="#e94560" font-family="sans-serif" font-weight="600">Alex</text>
  <text x="486" y="155" font-size="10" fill="#555" font-family="sans-serif">2:30 PM</text>
  <text x="436" y="174" font-size="13" fill="#ccc" font-family="sans-serif">Hey everyone! The new feature is deployed</text>

  <!-- Message 2 -->
  <circle cx="410" cy="220" r="16" fill="#4ade80"/>
  <text x="410" y="225" font-size="12" fill="#fff" text-anchor="middle" font-family="sans-serif" font-weight="bold">S</text>
  <text x="436" y="215" font-size="14" fill="#4ade80" font-family="sans-serif" font-weight="600">Sara</text>
  <text x="480" y="215" font-size="10" fill="#555" font-family="sans-serif">2:31 PM</text>
  <text x="436" y="234" font-size="13" fill="#ccc" font-family="sans-serif">Nice work! I'll run some tests on it</text>

  <!-- Message 3 -->
  <circle cx="410" cy="280" r="16" fill="#f59e0b"/>
  <text x="410" y="285" font-size="12" fill="#fff" text-anchor="middle" font-family="sans-serif" font-weight="bold">M</text>
  <text x="436" y="275" font-size="14" fill="#f59e0b" font-family="sans-serif" font-weight="600">Mike</text>
  <text x="484" y="275" font-size="10" fill="#555" font-family="sans-serif">2:32 PM</text>
  <text x="436" y="294" font-size="13" fill="#ccc" font-family="sans-serif">Looks great on mobile too!</text>

  <!-- Message 4 - code block -->
  <circle cx="410" cy="340" r="16" fill="#6c63ff"/>
  <text x="410" y="345" font-size="12" fill="#fff" text-anchor="middle" font-family="sans-serif" font-weight="bold">Y</text>
  <text x="436" y="335" font-size="14" fill="#6c63ff" font-family="sans-serif" font-weight="600">You</text>
  <text x="468" y="335" font-size="10" fill="#555" font-family="sans-serif">2:33 PM</text>
  <text x="436" y="354" font-size="13" fill="#ccc" font-family="sans-serif">Thanks! Here's the WebSocket config:</text>
  <rect x="436" y="365" width="400" height="70" rx="6" fill="#0d0d1a" stroke="#333" stroke-width="1"/>
  <text x="450" y="385" font-size="11" fill="#4ade80" font-family="monospace">const ws = new WebSocket(url);</text>
  <text x="450" y="402" font-size="11" fill="#4ade80" font-family="monospace">ws.onmessage = (e) =&gt; {</text>
  <text x="450" y="419" font-size="11" fill="#4ade80" font-family="monospace">  broadcast(JSON.parse(e.data));</text>
  <text x="450" y="436" font-size="11" fill="#ccc" font-family="monospace">}</text>

  <!-- Message 5 -->
  <circle cx="410" cy="475" r="16" fill="#e94560"/>
  <text x="410" y="480" font-size="12" fill="#fff" text-anchor="middle" font-family="sans-serif" font-weight="bold">A</text>
  <text x="436" y="470" font-size="14" fill="#e94560" font-family="sans-serif" font-weight="600">Alex</text>
  <text x="486" y="470" font-size="10" fill="#555" font-family="sans-serif">2:34 PM</text>
  <text x="436" y="489" font-size="13" fill="#ccc" font-family="sans-serif">Clean implementation!</text>

  <!-- Typing indicator -->
  <text x="410" y="540" font-size="12" fill="#888" font-family="sans-serif" font-style="italic">Sara is typing</text>
  <circle cx="500" cy="537" r="3" fill="#888" opacity="0.4">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="510" cy="537" r="3" fill="#888" opacity="0.4">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="537" r="3" fill="#888" opacity="0.4">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

