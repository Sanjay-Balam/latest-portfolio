  <polygon points="1049,681 1063,687 1049,693" fill="#fff"/>

  <!-- Title -->
  <text x="600" y="770" font-size="14" fill="#888" text-anchor="middle" font-family="monospace">Next.js  |  Bun  |  Elysia  |  TypeScript  |  WebSockets</text>
