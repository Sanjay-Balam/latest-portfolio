  <rect x="112" y="265" width="256" height="56" rx="8" fill="transparent"/>
  <circle cx="140" cy="293" r="16" fill="#2a2a4a"/>
  <text x="140" y="298" font-size="14" fill="#8b5cf6" text-anchor="middle" font-family="sans-serif" font-weight="bold">#</text>
  <text x="168" y="287" font-size="14" fill="#ccc" font-family="sans-serif">design</text>
  <text x="168" y="304" font-size="11" fill="#666" font-family="sans-serif">Mike: New mockups ready</text>

