  <rect x="112" y="330" width="256" height="56" rx="8" fill="transparent"/>
  <circle cx="140" cy="358" r="16" fill="#2a2a4a"/>
  <text x="140" y="363" font-size="14" fill="#8b5cf6" text-anchor="middle" font-family="sans-serif" font-weight="bold">#</text>
  <text x="168" y="352" font-size="14" fill="#ccc" font-family="sans-serif">random</text>
  <text x="168" y="369" font-size="11" fill="#666" font-family="sans-serif">You: Thanks!</text>

